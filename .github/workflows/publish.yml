# One-time recovery of the original, previously validated 2.4.2 release.
# This workflow exists only on the recovery branch. Its filename matches npm's
# trusted publisher configuration.
name: Recover CLI 2.4.2
on:
  push:
    branches: [codex/recover-cli-2.4.2]

permissions:
  contents: read

concurrency:
  group: publish-refs/heads/main
  cancel-in-progress: false

env:
  PATCH_SHA: b76e1b51901f8a043f1958c8b4213bee531dd5c1
  MINOR_SHA: 59ab66cb84095ea5d2fc6a5b9c268008bf172736

jobs:
  validate:
    name: Validate original 2.4.2 commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ env.PATCH_SHA }}
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Verify release readiness
        env:
          RELEASE_FROM: ${{ env.PATCH_SHA }}
          RELEASE_TO: ${{ env.PATCH_SHA }}
        run: npm run release:verify

  release:
    name: Publish CLI 2.4.2
    if: github.repository == 'emulsify-ds/emulsify-cli'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ env.PATCH_SHA }}
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Confirm the approved patch and publish it before 2.5.0
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "$PATCH_SHA"
          test "$(git rev-parse origin/main)" = "$MINOR_SHA"
          git merge-base --is-ancestor "$PATCH_SHA" origin/main
          node -e 'const p = require("./package.json"); if (p.name !== "@emulsify/cli" || p.version !== "2.4.2") process.exit(1);'
          latest="$(npm view @emulsify/cli dist-tags.latest --prefer-online)"
          if [ "$latest" != '2.4.1' ]; then
            echo "Expected npm latest to be 2.4.1 before patch recovery, but found $latest."
            exit 1
          fi
          npm publish --access public --provenance
