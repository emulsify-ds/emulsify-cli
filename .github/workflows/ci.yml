name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run type
      - name: Test
        run: npm test

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify package contents
        run: npm run pack:dry-run
      - name: Smoke test packed install
        run: npm run smoke:pack
      - name: Verify release calculation
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          RELEASE_FROM: ${{ github.event.pull_request.base.sha }}
          RELEASE_TO: HEAD
          RELEASE_SQUASH_MESSAGE: ${{ github.event.pull_request.title }}
        run: npm run release:analyze
